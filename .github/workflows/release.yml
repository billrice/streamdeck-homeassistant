name: Create and upload release assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine tag name
        id: tagName
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update manifest version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const file='public/manifest.json'; const manifest=JSON.parse(fs.readFileSync(file, 'utf8')); manifest.Version='${{ steps.tagName.outputs.tag }}.${{ github.run_number }}'; fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');"

      - name: NPM Install
        run: npm ci
      - name: VUE Build
        run: npm run build
      - name: Streamdeck Bundle
        run: npm run bundle

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagName.outputs.tag }}
          files: de.perdoctus.streamdeck.homeassistant.streamDeckPlugin
          overwrite_files: true
